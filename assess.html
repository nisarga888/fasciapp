<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Assessment · FasciApp</title>
<link rel="icon" href="/assets/favicon-32-v4.png" type="image/png">
<style>
  :root{--bg:#02191E;--card:#0a2a30;--gold:#C99E67;--tx:#F3EDE4;--mut:#9fb3b5;--field:#062025}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font-family:Montserrat,system-ui,sans-serif}
  header{display:flex;align-items:center;gap:10px;padding:16px 18px 10px}
  header b{font-size:22px;font-weight:800} header b span{color:var(--gold)}
  .hair{height:3px;background:linear-gradient(90deg,#8a6537,#f6dfa9,#c99e67)}
  main{max-width:560px;margin:0 auto;padding:18px 18px 48px}
  .pill{display:block;width:fit-content;margin:8px auto 16px;padding:6px 12px;border-radius:999px;background:#10282e;color:var(--mut);font-size:12px}
  .who{text-align:center}
  .av{width:72px;height:72px;border-radius:50%;object-fit:cover;border:2px solid var(--gold)}
  .fb{width:72px;height:72px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;border:2px solid var(--gold);color:var(--gold);font-weight:800}
  h1{margin:10px 0 2px;font-size:26px}
  h2{margin:0;font-size:18px}
  .sub{color:var(--mut);margin:0 0 12px}
  .intro{margin:0 0 18px;line-height:1.45}
  .sec{margin:18px 0;padding:14px;border:1px solid #C99E6733;border-radius:16px;background:#071f24}
  .sec small{display:block;color:var(--mut);font-weight:500;margin-top:2px}
  label.f{display:block;margin:12px 0 6px;color:var(--mut);font-size:13px}
  input,textarea,select{width:100%;padding:12px 14px;border-radius:12px;border:1px solid #1d4a52;background:var(--field);color:var(--tx);font:inherit;font-size:16px}
  textarea{min-height:72px;resize:vertical}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chips label{border:1px solid #C99E6766;border-radius:999px;padding:6px 10px;font-size:13px}
  .chips input{width:auto;margin-right:4px}
  .photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .ph{position:relative;aspect-ratio:3/4;border:1px dashed #C99E6788;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--gold);font-size:13px;overflow:hidden}
  .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .ph.ok{border-style:solid}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .agree{display:flex;gap:10px;align-items:flex-start;margin:16px 0;color:var(--tx);font-size:14px;line-height:1.4}
  .agree input{width:auto;margin-top:3px}
  .send{width:100%;margin-top:8px;padding:14px;border:0;border-radius:999px;background:var(--gold);color:#02191E;font:inherit;font-size:18px;font-weight:800}
  .send:disabled{opacity:.6}
  .msg{min-height:1.2em;color:#e7b4b0;font-size:14px}
  .thanks{text-align:center;padding-top:12px}
  .tick{width:72px;height:72px;margin:18px auto;border-radius:50%;border:2px solid var(--gold);color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:34px}
  .hide{display:none}
  .tip{color:var(--mut);font-size:12.5px;line-height:1.4}
  .pq{margin:10px 0 14px}
  .pq p{margin:0 0 6px}
  .rt{display:flex;flex-wrap:wrap;gap:4px}
  .rt label{font-size:11px;color:var(--mut);text-align:center}
  .gSc{display:flex;justify-content:space-between;color:var(--mut);font-size:11px;gap:4px}
</style>
</head>
<body>
<header><svg width="28" height="28" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="30" fill="none" stroke="#C99E67" stroke-width="2"/><circle cx="32" cy="18" r="6" fill="#C99E67"/><path d="M20 50c2-10 8-16 12-16s10 6 12 16" fill="#C99E67"/></svg><b>Fasci<span>App</span></b></header>
<div class="hair"></div>
<main>
  <span class="pill" id="path"></span>
  <div id="formView">
    <div class="who" id="who"><p class="sub">Loading…</p></div>
    <form id="f" class="hide"></form>
  </div>
  <div id="thanks" class="thanks hide"></div>
</main>
<script src="/app/config.js"></script>
<script src="/app/gifts.js?v=0.23.294"></script>
<script>
(function(){
  const cfg = window.FASCIAPP_CONFIG || {};
  const token = (new URLSearchParams(location.search).get("t") || "").trim().toLowerCase();
  const path = document.getElementById("path");
  path.textContent = "fasciapp.app/intake/" + (token || "");
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const files = {};
  let info = null, tok = null, tokAt = 0, widgetId = null, waitTok = null;
  const draftKey = () => "faAssessDraft:" + token;
  const SECTIONS = [
    ["1","Main complaint & goal",[["chips","reasons","Reason for coming","Pain,Stiffness,Posture,Breath,Stress,Emotional tension,Other"],["area","complaint","What brings you in?","e.g. lower back pain after sitting"],["area","goal","What would you like to be able to do again?","e.g. play with my kids without pain"]]],
    ["2","Pain map",[["chips","pain_areas","Where does it hurt?","Head,Jaw,Neck,Shoulders,Upper back,Chest,Arms,Elbows,Wrists / hands,Lower back,Abdomen,Pelvis,Hips,Glutes,Thighs,Knees,Calves,Ankles,Feet"],["range","pain_intensity","Intensity (0–10)"],["chips","pain_type","Type of pain","Sharp,Dull,Burning,Radiating,Aching,Tingling,Pulling,Heavy,Tight"],["radio","pain_pattern","Constant or comes and goes?","Constant,Comes and goes"]]],
    ["3","Tension & stiffness",[["chips","tension_areas","Where do you feel tight or restricted?","Jaw,Neck,Shoulders,Upper back,Chest,Diaphragm,Lower back,Hips,Hamstrings,Calves,Feet"],["chips","tension_when","When is it worse?","Morning,Evening,After sitting,After standing,After exercise,Under stress,Cold weather,Night"]]],
    ["4","History & timeline",[["text","started","When did it start?","e.g. 2 years ago"],["select","onset","Onset","Sudden,Gradual,Not sure"],["text","better","What makes it better?","e.g. walking, warmth"],["text","worse","What makes it worse?","e.g. long drives"],["area","started_life","When it started, what was happening in your life then?",""],["text","prev_treatment","Previous treatment and what helped",""]]],
    ["5","Injuries, surgeries & scars",[["area","injuries","Old ones count too. Scars often shape fascial patterns.",""]]],
    ["6","Body basics",[["num","age","Age"],["num","height_cm","Height cm"],["num","weight_kg","Weight kg"],["radio","dominant_hand","Dominant hand","Right,Left,Both"],["chips","structural","Known structural issues","Scoliosis,Leg length difference,Flat feet,Hypermobility,None known"],["text","structural_other","Other",""]]],
    ["7","Daily posture & activity",[["chips","daily","Daily posture","Desk work,Standing work,Driving,Lots of phone use,Physical work,Caring for kids"],["text","exercise","Sport & exercise (what, how often)","e.g. yoga 2× week"]]],
    ["8","Sleep, stress & breath",[["radio","sleep","Sleep quality","Good,Okay,Poor,Very poor"],["range","stress","Stress level (0–10)"],["chips","breath","Breathing","Shallow,Hold my breath,Chest breathing,Mouth breathing,Sigh a lot,Feels free"],["chips","stress_response","Under stress my body tends to","Tense up,Go numb or spacey,Get restless,Collapse"],["text","breath_experience","Breathwork or meditation experience",""]]],
    ["9","How do you experience your body?",[["area","body_experience","In your own words","e.g. I feel heavy in my legs, my chest feels closed"]]],
    ["10","Health & medication",[["area","health","Health conditions and medication","e.g. hypothyroid, ibuprofen as needed"],["chips","red_flags","Do any of these apply?","Pregnancy,Blood thinners,Recent trauma or accident,Unexplained weight loss,Numbness or loss of strength,Fever or night sweats,Constant or night pain not changed by position,Bowel or bladder changes / groin numbness,Chest pain / palpitations / unexplained breathlessness,Swollen hot or painful calf,Known cancer / osteoporosis / aneurysm / hernia / inflammatory flare,Surgery in the last 6 weeks,Dizziness / fainting / stroke / vertebral artery history"]]],
    ["11","Emotional background & touch",[["area","emotional","Anything you'd like your practitioner to know?",""],["chips","touch","Touch & boundaries","Light pressure,Medium pressure,Deep pressure,Ask before each area,Avoid some areas"],["text","touch_notes","Areas to avoid or other wishes",""],["radio","draping","Clothing and draping","Underwear,Shorts and top,Other"],["text","stop_signal","Your stop signal","e.g. the word pause"],["radio","release_ok","Emotions, sounds, tears or movement may arise","That’s okay,Talk about it first"],["chips","photo_consent","Photo consent","Front,Sides,Back,None"]]]
  ];
  function field(f){
    const [kind,k,label,opt] = f;
    if(kind==="chips"||kind==="radio") return '<label class="f">'+esc(label)+'</label><div class="chips" data-k="'+k+'" data-r="'+(kind==="radio"?"1":"")+'">'+String(opt).split(",").map(o=>'<label><input type="'+(kind==="radio"?"radio":"checkbox")+'" name="'+k+'" value="'+esc(o)+'">'+esc(o)+'</label>').join("")+'</div>';
    if(kind==="area") return '<label class="f">'+esc(label)+'</label><textarea data-k="'+k+'" placeholder="'+esc(opt||"")+'"></textarea>';
    if(kind==="range") return '<label class="f">'+esc(label)+'</label><input type="range" min="0" max="10" value="0" data-k="'+k+'">';
    if(kind==="num") return '<label class="f">'+esc(label)+'</label><input type="number" inputmode="decimal" data-k="'+k+'" min="0">';
    if(kind==="select") return '<label class="f">'+esc(label)+'</label><select data-k="'+k+'"><option value="">Choose</option>'+String(opt).split(",").map(o=>'<option>'+esc(o)+'</option>').join("")+'</select>';
    return '<label class="f">'+esc(label)+'</label><input data-k="'+k+'" placeholder="'+esc(opt||"")+'" maxlength="2000">';
  }
  function photos(){
    return '<section class="sec"><h2>Posture photos<small>Front, side and back. Standing relaxed, feet hip-width. All three are required.</small></h2><div class="photos" id="photos"></div><p class="tip">Full body in frame, plain wall, fitted clothes, camera at hip height.</p></section>';
  }
  function gifts(){
    const FG = window.FA_GIFTS; if(!FG) return "";
    return '<section class="sec"><h2>Your Five Gifts<small>A short self-reflection. About 3 minutes.</small></h2><p class="tip">'+esc(FG.INTRO)+'</p><div class="gSc"><span>0 Not true</span><span>4 Very true</span></div><div id="pqs">'+FG.Q.map((q,i)=>'<div class="pq"><p>'+(i+1)+'. '+esc(q[2])+'</p><div class="rt">'+FG.SCALE.map((l,v)=>'<label><input type="radio" name="pq_'+q[0]+'" value="'+v+'"><b>'+v+'</b></label>').join("")+'</div></div>').join("")+'</div><p class="tip">'+esc(FG.DISC)+'</p></section>';
  }
  function paint(unavailable){
    const p = info.practitioner || {}, first = info.first || "there", nm = p.name || "Your practitioner";
    document.title = "Assessment · " + nm;
    document.getElementById("who").innerHTML = (p.photo ? '<img class="av" alt="" src="'+esc(p.photo)+'">' : '<span class="fb">'+esc(nm.slice(0,1))+'</span>')
      + '<h1>'+esc(nm)+'</h1><p class="sub">Client assessment · no account needed'+(p.city?' · '+esc(p.city):'')+'</p>'
      + '<p class="intro">Hi '+esc(first)+' — please fill this in before your session. It only takes a couple of minutes.</p>';
    const form = document.getElementById("f");
    if(unavailable){form.classList.add("hide"); document.getElementById("who").insertAdjacentHTML("beforeend",'<p class="msg">This practitioner\'s form isn\'t available right now.</p>'); return;}
    form.classList.remove("hide");
    form.innerHTML = '<section class="sec"><h2>You</h2><label class="f">Name</label><input id="client_name" value="'+esc(info.name||"")+'" maxlength="80"><label class="f">Email or phone</label><input data-k="contact" maxlength="120" autocomplete="email"><label class="f">Date of birth</label><input data-k="dob" maxlength="40" placeholder="12 March 1988"></section>'
      + photos()
      + SECTIONS.map(s=>'<section class="sec"><h2>'+esc(s[1])+'</h2>'+s[2].map(field).join("")+'</section>').join("")
      + gifts()
      + '<label class="agree"><input type="checkbox" id="consent"><span>I agree my answers and photos are shared privately with my practitioner; stored securely in the EU</span></label><div id="ts"></div><p class="msg" id="msg"></p><button class="send" type="submit">Send</button>';
    ["front","side","back"].forEach(v=>{
      const l = document.createElement("label"); l.className = "ph";
      l.innerHTML = '<b>'+v[0].toUpperCase()+v.slice(1)+'</b><small>Tap to add</small><input type="file" accept="image/*" hidden>';
      l.querySelector("input").onchange = e => { const file = e.target.files[0]; if(!file) return; const u = URL.createObjectURL(file); const im = new Image(); im.onload = () => { files[v] = file; let i = l.querySelector("img"); if(!i){ i = document.createElement("img"); l.prepend(i); } i.src = u; l.classList.add("ok"); }; im.src = u; };
      document.getElementById("photos").append(l);
    });
    restoreDraft();
    form.addEventListener("input", saveDraft);
    form.addEventListener("change", saveDraft);
    const s = document.createElement("script");
    s.src = "https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit";
    s.onload = () => { widgetId = window.turnstile.render("#ts", {sitekey:"0x4AAAAAAFvW3PHVqRby8-Fk", action:"assess", theme:"dark", size:"flexible", callback:onToken, "expired-callback":()=>{tok=null;tokAt=0}, "error-callback":()=>{tok=null;tokAt=0}}); };
    document.head.appendChild(s);
    form.onsubmit = submit;
  }
  function onToken(t){ tok = t; tokAt = Date.now(); if(waitTok){ const go = waitTok; waitTok = null; go(t); } }
  function freshToken(force){
    const stale = !tok || (Date.now() - tokAt) > 4 * 60 * 1000;
    if(!force && !stale) return Promise.resolve(tok);
    return new Promise((resolve, reject) => {
      const timer = setTimeout(() => { waitTok = null; reject(new Error("security")); }, 20000);
      waitTok = t => { clearTimeout(timer); resolve(t); };
      try { window.turnstile.reset(widgetId); } catch(e) { clearTimeout(timer); waitTok = null; reject(new Error("security")); }
    });
  }
  function saveDraft(){
    try {
      const name = (document.getElementById("client_name") || {}).value || "";
      localStorage.setItem(draftKey(), JSON.stringify({ name, data: collect() }));
    } catch(e) {}
  }
  function restoreDraft(){
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(draftKey()) || "null"); } catch(e) { saved = null; }
    if(!saved || !saved.data) return;
    const name = document.getElementById("client_name");
    if(name && saved.name) name.value = saved.name;
    const d = saved.data;
    document.querySelectorAll("[data-k]").forEach(el => {
      const k = el.dataset.k, v = d[k];
      if(v == null) return;
      if(el.classList.contains("chips")){ const a = [].concat(v); el.querySelectorAll("input").forEach(i => { i.checked = a.includes(i.value); }); }
      else el.value = v;
    });
    const answers = (d.gifts && d.gifts.answers) || {};
    Object.keys(answers).forEach(q => { const x = document.querySelector('#pqs input[name="pq_'+q+'"][value="'+answers[q]+'"]'); if(x) x.checked = true; });
  }
  function collect(){
    const d = {};
    document.querySelectorAll("[data-k]").forEach(el=>{
      const k = el.dataset.k;
      if(el.classList.contains("chips")){ const v = [...el.querySelectorAll("input:checked")].map(i=>i.value); d[k] = el.dataset.r ? (v[0]||null) : (Array.isArray(d[k])?d[k].concat(v):v); }
      else if(el.value!=="") d[k] = el.type==="number"||el.type==="range" ? Number(el.value) : el.value.trim();
    });
    const FG = window.FA_GIFTS, pt = {};
    document.querySelectorAll("#pqs input:checked").forEach(x=>pt[x.name.slice(3)] = Number(x.value));
    if(FG && Object.keys(pt).length){ const r = FG.score(pt); r.answers = pt; d.gifts = r; }
    return d;
  }
  function readBlob(b){
    return new Promise(res => { if(!b){ res(null); return; } const r = new FileReader(); r.onload = () => res(String(r.result || "")); r.onerror = () => res(""); r.readAsDataURL(b); });
  }
  function looksWebp(url){ return /^data:image\/webp;base64,/.test(url || ""); }
  function looksJpeg(url){ return /^data:image\/jpeg;base64,/.test(url || ""); }
  function shrink(file){
    return new Promise(res => {
      const im = new Image();
      im.onload = () => {
        const s = Math.min(1, 1400 / Math.max(im.width || 1, im.height || 1)), c = document.createElement("canvas");
        c.width = Math.max(1, Math.round(im.width * s)); c.height = Math.max(1, Math.round(im.height * s));
        c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
        const asJpeg = () => {
          try { const u = c.toDataURL("image/jpeg", 0.82); if(looksJpeg(u)) { res(u); return; } } catch(e) {}
          if(!c.toBlob){ res(null); return; }
          c.toBlob(b => readBlob(b).then(u => res(looksJpeg(u) ? u : null)), "image/jpeg", 0.82);
        };
        if(!c.toBlob){ try { const u = c.toDataURL("image/webp", 0.72); if(looksWebp(u)) res(u); else asJpeg(); } catch(e) { asJpeg(); } return; }
        c.toBlob(b => {
          const type = b && b.type;
          if(b && (type === "image/webp" || type === "")){
            readBlob(b).then(u => { if(looksWebp(u)) res(u); else asJpeg(); });
          } else asJpeg();
        }, "image/webp", 0.72);
      };
      im.onerror = () => res(null);
      im.src = URL.createObjectURL(file);
    });
  }
  function failText(status, j, err){
    if(err && err.message === "photo") return "One of the photos couldn't be prepared. Please add it again as a JPG or PNG.";
    if(err && err.message === "security") return "Please complete the security check.";
    if(err && (err.name === "TypeError" || /fetch|network/i.test(err.message || ""))) return "The connection failed. Your answers are still here. Please try again.";
    const e = j && j.error;
    if(e) return e;
    return "That didn't work. Your answers are still here. Please try again.";
  }
  async function postAssess(securityToken, photos){
    const r = await fetch(cfg.SUPABASE_URL + "/functions/v1/submit-assess", {method:"POST", headers:{"content-type":"application/json", apikey:cfg.SUPABASE_ANON_KEY, authorization:"Bearer " + cfg.SUPABASE_ANON_KEY},
      body: JSON.stringify({link:token, token:securityToken, consent:true, data:collect(), photos})});
    const j = await r.json().catch(() => ({}));
    return { ok: r.ok, status: r.status, j };
  }
  async function photosPayload(){
    const photos = {};
    for(const v of ["front","side","back"]){
      photos[v] = await shrink(files[v]);
      if(!photos[v]) throw new Error("photo");
    }
    return photos;
  }
  async function submit(e){
    e.preventDefault();
    const msg = document.getElementById("msg"), btn = e.target.querySelector(".send");
    saveDraft();
    if(!document.getElementById("consent").checked){ msg.textContent = "Please agree to share your answers with your practitioner."; return; }
    if(!files.front || !files.side || !files.back){ msg.textContent = "Please add all three photos."; document.getElementById("photos").scrollIntoView({block:"center"}); return; }
    btn.disabled = true; msg.textContent = "Sending privately…";
    try{
      const photos = await photosPayload();
      let securityToken = await freshToken(false);
      let result = await postAssess(securityToken, photos);
      if(!result.ok && result.status === 400 && /security check/i.test((result.j && result.j.error) || "")){
        msg.textContent = "Checking again…";
        securityToken = await freshToken(true);
        result = await postAssess(securityToken, photos);
      }
      if(!result.ok || !result.j || result.j.ok !== true){
        msg.textContent = failText(result.status, result.j, null);
        btn.disabled = false;
        return;
      }
      try { localStorage.removeItem(draftKey()); } catch(x) {}
      const nm = (info.practitioner && info.practitioner.name) || "Your practitioner";
      document.getElementById("formView").classList.add("hide");
      const t = document.getElementById("thanks"); t.classList.remove("hide");
      t.innerHTML = '<div class="tick">✓</div><h1>Thank you, '+esc(info.first||"")+'</h1><p class="intro">'+esc(nm)+' has your assessment and will use it to prepare for your session.</p><p class="sub">You can close this page.</p>';
    }catch(err){ msg.textContent = failText(0, null, err); btn.disabled = false; }
  }
  async function open(){
    if(!/^[a-f0-9]{36}$/.test(token)){ document.getElementById("who").innerHTML = "<p>This link isn't valid.</p>"; return; }
    const r = await fetch(cfg.SUPABASE_URL+"/functions/v1/assess-open", {method:"POST", headers:{"content-type":"application/json", apikey:cfg.SUPABASE_ANON_KEY, authorization:"Bearer "+cfg.SUPABASE_ANON_KEY}, body:JSON.stringify({token})});
    if(!r.ok){ document.getElementById("who").innerHTML = "<p>This link isn't valid.</p>"; return; }
    info = await r.json();
    paint(!info.allowed);
  }
  open();
})();
</script>
</body>
</html>
