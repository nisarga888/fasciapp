<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Your Assessment · FasciApp</title><meta name="robots" content="noindex"><meta name="theme-color" content="#02191E">
<link rel="icon" href="favicon-32-v4.png">
<style>
@view-transition{navigation:auto}
:root{--bg:#02191E;--gold:#C99E67;--tx:#F3EDE4;--mut:#9fb3b5;--ln:#c99e6733;--font:-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:var(--font);color:var(--tx);background:radial-gradient(120% 60% at 50% -10%,#0f3a40 0%,var(--bg) 60%) fixed;min-height:100vh;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:auto;padding:18px 16px 120px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}.top a,.top button.lk{color:var(--gold);text-decoration:none;font-size:14px;background:none;border:0;padding:0;width:auto;box-shadow:none;font-weight:400;cursor:pointer}
.hero{text-align:center;padding:18px 6px 8px}.hero .k{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gold)}
.hero h1{font-weight:300;font-size:28px;margin:6px 0 6px;letter-spacing:.5px}.hero p{color:var(--mut);font-size:14px;line-height:1.55;margin:0}
.view{display:none}.view.on{display:block;animation:in .55s cubic-bezier(.2,.7,.2,1) both}.view.out{animation:out .3s ease both}
@keyframes in{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}@keyframes out{to{opacity:0;transform:translateY(-10px)}}
.card{background:linear-gradient(180deg,#0c3036,#0a2a30);border:1px solid var(--ln);border-radius:20px;padding:18px 16px;margin-top:16px;box-shadow:0 8px 24px #0006;opacity:0;animation:in .6s cubic-bezier(.2,.7,.2,1) forwards}
.sh{display:flex;gap:12px;align-items:center;margin-bottom:10px}.n{flex:none;width:30px;height:30px;border-radius:50%;border:1px solid var(--gold);color:var(--gold);display:grid;place-items:center;font-size:13px}
.sh h2{font-size:17px;font-weight:500;margin:0}.sh small{display:block;color:var(--mut);font-size:12px;font-weight:400;margin-top:2px}
.it{padding:10px 0;border-top:1px solid #c99e671a}.it:first-of-type{border-top:0}.it h3{font-size:14px;color:var(--gold);font-weight:500;margin:0 0 4px}.it p{margin:0;font-size:14.5px;line-height:1.6;color:#e6ece9}
.str{list-style:none;padding:0;margin:0 0 10px}.str li{padding:6px 0 6px 26px;position:relative;font-size:14.5px;line-height:1.5}.str li:before{content:"✦";position:absolute;left:4px;color:var(--gold)}
.core{font-size:15px;line-height:1.6;padding:12px 14px;border-left:2px solid var(--gold);background:#02191E88;border-radius:0 12px 12px 0;margin:6px 0 12px}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}.tbl td{padding:8px 6px;border-top:1px solid #c99e671a;vertical-align:top;line-height:1.45}.tbl td:first-child{color:var(--gold);width:38%}
.dir{margin-top:12px;font-size:15px;color:var(--gold);font-style:italic;line-height:1.5}
.note{font-size:13.5px;line-height:1.55;padding:14px;border-radius:14px;margin-top:16px}.note.ok{background:#0E4A5066;border:1px solid #4fa3a0;color:#cfe9e6}.note.rf{background:#5a2a1a66;border:1px solid #e0915a;color:#ffd9bf}.note.ph{background:#02191E88;border:1px dashed #c99e6766;color:var(--mut)}
.disc{font-size:12px;color:var(--mut);line-height:1.6;margin:22px 4px 0;text-align:center}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.photos img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:14px;border:1px solid var(--ln);background:#0a2a30}
button{width:100%;font:inherit;font-size:16px;font-weight:600;padding:16px;border-radius:28px;border:0;background:linear-gradient(90deg,#d8b07a,#C99E67);color:var(--bg);cursor:pointer;box-shadow:0 6px 20px #c99e6740;transition:transform .15s}button:active{transform:scale(.98)}
.big{margin-top:24px;font-size:17px;padding:18px}
.ses{position:relative;padding-left:58px}.ses .num{position:absolute;left:14px;top:18px;width:32px;height:32px;border-radius:50%;background:var(--gold);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:14px}
.ses h2{font-size:16px;font-weight:500;margin:0 0 10px;line-height:1.35}.row{display:flex;gap:10px;padding:7px 0;border-top:1px solid #c99e671a;font-size:14px;line-height:1.5}.row b{flex:none;width:22px;text-align:center}
.lbl{display:block;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--gold);margin-bottom:1px}
.prep{text-align:center;padding:70px 16px}.orb{width:120px;height:120px;margin:0 auto 30px;border-radius:50%;background:radial-gradient(circle,#C99E67 0%,#c99e6733 45%,transparent 70%);animation:br 6s ease-in-out infinite}
@keyframes br{0%,100%{transform:scale(.7);opacity:.6}50%{transform:scale(1.1);opacity:1}}
.prep h2{font-weight:300;font-size:24px;margin:0 0 10px}.prep p{color:var(--mut);font-size:14.5px;line-height:1.6;margin:0 auto;max-width:340px}.prep .cue{margin-top:24px;color:var(--gold);font-size:13px;letter-spacing:2px;text-transform:uppercase;animation:cue 6s ease-in-out infinite}
@keyframes cue{0%,45%{opacity:1}50%,95%{opacity:.35}}
.li{display:flex;justify-content:space-between;align-items:center;text-decoration:none;color:var(--tx)}.li span{color:var(--mut);font-size:13px}.pill{font-size:11px;padding:3px 9px;border-radius:10px;border:1px solid var(--gold);color:var(--gold)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}
</style></head><body><div class="wrap">
<div class="top"><a href="./" id="back">← FasciApp</a><span style="font-size:12px;color:var(--mut)">Private · only you see this</span></div>
<div id="vLoad" class="view on prep"><div class="orb"></div></div>
<div id="vList" class="view"></div>
<div id="vPrep" class="view prep"><div class="orb"></div><h2>Your assessment is being prepared</h2><p>Your photos and answers are saved safely. We're reading them carefully and writing your whole-body map and your 10-session plan.</p><p style="margin-top:12px">This page will update by itself. You can close it and come back any time.</p><div class="cue" id="cue">Breathe in</div></div>
<div id="vRes" class="view"></div>
<div id="vPlan" class="view"></div>
</div>
<script src="config.js?v=0.23.126"></script><script src="track.js?v=0.23.126"></script>
<script src="vendor/supabase-js-2.118.0.min.js"></script>
<script>
(function(){
const C=window.FASCIAPP_CONFIG,sb=supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,storage:localStorage,storageKey:"fasciapp-auth"}});
const $=s=>document.querySelector(s),E=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const id=new URLSearchParams(location.search).get("id");let cur=$("#vLoad"),row=null,timer=null;
const show=(v,top=true)=>{if(cur===v)return;const o=cur;cur=v;o.classList.add("out");setTimeout(()=>{o.classList.remove("on","out");v.classList.add("on");if(top)scrollTo({top:0,behavior:"instant"})},280)};
setInterval(()=>{const c=$("#cue");c.textContent=c.textContent=="Breathe in"?"Breathe out":"Breathe in"},3000);
const stag=(h)=>{let i=0;return h.replace(/class="card/g,()=>'style="animation-delay:'+(0.08*i++)+'s" class="card')};
function renderRes(r){const R=r.report,ph=['front','side','back'].map(v=>'<img data-p="'+E(r['photo_'+v])+'" alt="'+v+'">').join('');
 let h='<div class="hero"><div class="k">Body Assessment</div><h1>'+E(r.client_name||R.client||"Your results")+'</h1><p>'+E(R.date||"")+'</p></div><div class="photos">'+ph+'</div>';
 h+='<div class="note '+(R.red_flag&&R.red_flag.level!="none"?"rf":"ok")+'">'+(R.red_flag&&R.red_flag.level!="none"?"⚠️ <b>Please get medical clearance before bodywork and breathwork.</b> ":"✓ ")+E(R.red_flag&&R.red_flag.text)+'</div>';
 R.sections.forEach((s,i)=>{h+='<section class="card"><div class="sh"><div class="n">'+(s.key=="map"?"◎":i)+'</div><h2>'+E(s.title)+'<small>'+E(s.subtitle||"")+'</small></h2></div>';
  if(s.key=="map"){h+='<ul class="str">'+s.strengths.map(x=>'<li>'+E(x)+'</li>').join('')+'</ul><div class="core">'+E(s.core)+'</div><table class="tbl">'+s.links.map(l=>'<tr><td>'+E(l[0])+'</td><td>'+E(l[1])+'</td></tr>').join('')+'</table><div class="dir">'+E(s.direction)+'</div>'}
  else h+=s.items.map(x=>'<div class="it"><h3>'+E(x.h)+'</h3><p>'+E(x.p)+'</p></div>').join('');h+='</section>'});
 if(R.photo_note)h+='<div class="note ph">📷 '+E(R.photo_note)+'</div>';
 h+='<button class="big" id="toPlan">See your 10-session treatment plan →</button><p class="disc">'+E(R.disclaimer)+'</p>';
 $("#vRes").innerHTML=stag(h);$("#toPlan").onclick=()=>{history.pushState({v:"plan"},"","#plan");show($("#vPlan"));window.FA_ph&&FA_ph("assessment_plan_open",{})};
 $("#vRes").querySelectorAll("img[data-p]").forEach(async im=>{const {data}=await sb.storage.from("assessment-photos").createSignedUrl(im.dataset.p,3600);if(data)im.src=data.signedUrl});
 let p='<div class="hero"><div class="k">Treatment plan</div><h1>Your 10 sessions</h1><p>Bodywork and breathwork, step by step. Each session builds on the last, at your pace.</p></div>';
 R.plan.forEach(s=>{p+='<section class="card ses"><div class="num">'+s.n+'</div><h2>'+E(s.focus)+'</h2><div class="row"><b>✋</b><div><span class="lbl">Bodywork</span>'+E(s.bodywork)+'</div></div><div class="row"><b>🌬</b><div><span class="lbl">Breathwork</span>'+E(s.breathwork)+'</div></div><div class="row"><b>🏠</b><div><span class="lbl">Home practice</span>'+E(s.home)+'</div></div></section>'});
 p+='<button class="big" id="toRes">← Back to your results</button><p class="disc">'+E(R.disclaimer)+'</p>';
 $("#vPlan").innerHTML=stag(p);$("#toRes").onclick=()=>history.back();
}
window.onpopstate=()=>{if(!row||!row.report)return;show(location.hash=="#plan"?$("#vPlan"):$("#vRes"))};
async function load(){const {data,error}=await sb.from("assessments").select("id,client_name,photo_front,photo_side,photo_back,report,report_ready_at,created_at").eq("id",id).maybeSingle();
 if(error||!data){$("#vList").innerHTML='<div class="prep"><h2>Assessment not found</h2><p>It may belong to another account.</p></div>';return show($("#vList"))}
 row=data;if(!data.report){show($("#vPrep"));timer=setTimeout(load,8000);return}
 renderRes(data);window.FA_ph&&FA_ph("assessment_results_open",{});show(location.hash=="#plan"?$("#vPlan"):$("#vRes"))}
async function list(){const {data}=await sb.from("assessments").select("id,client_name,created_at,report_ready_at").order("created_at",{ascending:false});
 let h='<div class="hero"><div class="k">Fascia Lab</div><h1>My assessments</h1></div>';
 h+=(data&&data.length?data.map(a=>'<a class="card li" href="?id='+a.id+'"><div>'+E(a.client_name||"Assessment")+'<br><span>'+new Date(a.created_at).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"})+'</span></div><span class="pill">'+(a.report_ready_at?"Ready":"Preparing")+'</span></a>').join(''):'<p style="text-align:center;color:var(--mut)">No assessments yet.</p>')+'<a href="assessment.html"><button class="big">+ New assessment</button></a>';
 $("#vList").innerHTML=stag(h);show($("#vList"))}
sb.auth.getSession().then(({data})=>{if(!data.session){$("#vList").innerHTML='<div class="prep"><h2>Please sign in</h2><p><a style="color:var(--gold)" href="./">Sign in to FasciApp</a> to see your assessments.</p></div>';return show($("#vList"))}
 if(id){$("#back").href="assessment-results.html";$("#back").textContent="← My assessments";load()}else list()});
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&row&&!row.report){clearTimeout(timer);load()}});
})();
</script></body></html>
