<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>FasciApp</title>
<meta name="description" content="Find bodywork and breathwork practitioners on FasciApp.">
<meta property="og:site_name" content="FasciApp">
<meta property="og:title" content="FasciApp – Find bodywork &amp; breathwork practitioners near you">
<meta property="og:description" content="Find the practitioner your body has been looking for.">
<meta property="og:image" content="https://fasciapp.app/assets/og.png">
<meta property="og:type" content="website">
<link rel="icon" href="/assets/favicon-32-v4.png" type="image/png">
<!--
  GitHub Pages has no per-profile server. A path like /aisha-archer is not a file,
  so this 404 page sends people to /app/?p=<slug>. A place link such as /poland/warsaw
  goes to /app/?loc=poland&city=warsaw. A Lab link such as /lab/books/feel-to-heal
  goes to /app/?lab=books&item=feel-to-heal. The app opens a region or country before a
  profile, and leaves every other slug as a profile. Crawlers do not run this script,
  so Open Graph title and photo stay the site-wide image. Per-profile link previews
  are not available on GitHub Pages.
  Existing files (/, /app/, /scan/, /live/, /privacy.html, /terms.html, and the rest)
  are served normally and never hit this page.
-->
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#02191E;color:#F3EDE4;font-family:Montserrat,system-ui,sans-serif;text-align:center;padding:24px}
  a{color:#C99E67}
  p{color:#9fb3b5}
</style>
<script>
(function(){
  var RESERVED={"app":1,"scan":1,"live":1,"assets":1,"nl":1,"sig":1,"privacy":1,"terms":1,"index":1,"robots":1,"sitemap":1,"favicon":1,"manifest":1,"cname":1,"about":1,"admin":1,"api":1,"static":1,"public":1,"vendor":1,"ph":1,"lab":1,"news":1,"assessment":1,"trainees":1,"join":1,"search":1,"map":1,"profile":1,"auth":1,"scripts":1,"tools":1,"supabase":1,"readme":1,"www":1,"mail":1,"share":1,"reviews":1,"review":1,"login":1,"signup":1,"account":1,"404":1,"sw":1,"css":1,"js":1,"html":1,"intake":1};
  var path=(location.pathname||"").replace(/\/index\.html$/i,"").replace(/^\/+|\/+$/g,"").toLowerCase();
  var uuid=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
  var slugOk=function(s){return !!s&&s.length<=80&&s.indexOf(".")<0&&!RESERVED[s]&&!uuid.test(s)&&/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(s);};
  var extra=location.search?location.search.replace(/^\?/,"&"):"";
  var parts=path?path.split("/"):[];
  var LAB={"books":1,"courses":1,"breathing":1,"listen":1,"watch":1,"live":1};
  if(parts[0]==="lab"){
    var sec=parts[1]||"", item=parts[2]||"", gift=parts[3]||"";
    if(parts.length===1){location.replace("/app/?tab=lab"+extra+location.hash);return;}
    if(sec==="breathing"&&item==="gifts"){
      if(parts.length===3){location.replace("/app/?lab=breathing&item=gifts"+extra+location.hash);return;}
      if(parts.length===4&&slugOk(gift)){location.replace("/app/?lab=breathing&item=gifts&gift="+encodeURIComponent(gift)+extra+location.hash);return;}
      return;
    }
    if(sec==="journey"){
      if(parts.length===2){location.replace("/app/?lab=journey"+extra+location.hash);return;}
      if(parts.length===4&&item==="buddy"&&slugOk(gift)){location.replace("/app/?lab=journey&buddy="+encodeURIComponent(gift)+extra+location.hash);return;}
      return;
    }
    if(sec==="mood"){
      if(parts.length===2){location.replace("/app/?lab=mood"+extra+location.hash);return;}
      if(parts.length===3&&slugOk(item)){location.replace("/app/?lab=mood&feel="+encodeURIComponent(item)+extra+location.hash);return;}
      return;
    }
    if(parts.length===2&&LAB[sec]){location.replace("/app/?lab="+encodeURIComponent(sec)+extra+location.hash);return;}
    if(parts.length===3&&LAB[sec]&&slugOk(item)){location.replace("/app/?lab="+encodeURIComponent(sec)+"&item="+encodeURIComponent(item)+extra+location.hash);return;}
    return;
  }
  if(parts[0]==="p"&&parts.length===3&&parts[2]==="lab"&&(slugOk(parts[1])||uuid.test(parts[1]))){location.replace("/app/?p="+encodeURIComponent(parts[1])+"&view=lab"+extra+location.hash);return;}
  if(parts.length===2&&parts[0]==="intake"&&slugOk(parts[1])){location.replace("/intake.html?s="+encodeURIComponent(parts[1])+extra+location.hash);return;}
  if(parts.length===2&&parts[0]!=="p"&&slugOk(parts[0])&&slugOk(parts[1])){location.replace("/app/?loc="+encodeURIComponent(parts[0])+"&city="+encodeURIComponent(parts[1])+extra+location.hash);return;}
  if(parts.length!==1||!slugOk(parts[0])) return;
  location.replace("/app/?p="+encodeURIComponent(parts[0])+extra+location.hash);
})();
</script>
</head>
<body>
  <div>
    <p id="msg">Page not found.</p>
    <p><a href="/">FasciApp home</a> · <a href="/app/">Open the app</a></p>
  </div>
</body>
</html>
